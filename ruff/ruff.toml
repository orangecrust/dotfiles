exclude = []
line-length = 120
indent-width = 4
target-version = "py310"

[format]
exclude = ["*.pyi"]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[lint]
select = ["ALL"]
ignore = [
    "D100",    # Allow missing module docstrings.
    "D107",    # Allow missing __init__ docstrings.
    "D203",    # Allow no blank line before class docstrings.
    "D212",    # Allow summary lines on the second docstring line.
    "EM101",   # Allow string literals directly in exceptions.
    "EM102",   # Allow f-strings directly in exceptions.
    "FIX002",  # Allow TODO/FIXME comments.
    "PLR0913", # Allow functions with many arguments.
    "RET504",  # Allow unnecessary assignments before returning.
    "T100",    # Allow debugger calls such as breakpoint().
    "TRY003",  # Allow long exception messages.
]

